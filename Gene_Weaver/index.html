<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeneWeaver | GPU-Accelerated CRISPR Alignment Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              900: '#14532d',
            },
            dna: {
              cyan: '#06b6d4',
              purple: '#8b5cf6',
              rose: '#f43f5e',
              amber: '#f59e0b',
            }
          }
        }
      }
    }
  </script>
   <style>
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .pulse-subtle { animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-brand-500 selection:text-white">

  <!-- Top Navigation Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 via-dna-cyan to-dna-purple flex items-center justify-center shadow-lg shadow-brand-500/20">
          <i class="fa-solid fa-dna text-white text-lg"></i>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-brand-400 bg-clip-text text-transparent">GeneWeaver</h1>
            <span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-brand-500/10 text-brand-400 border border-brand-500/20">v1.0</span>
          </div>
          <p class="text-xs text-slate-400">High-Performance CRISPR-Cas9 Tensor Alignment Engine</p>
        </div>
      </div>
 <!-- System Telemetry Badge -->
      <div class="flex items-center space-x-4">
        <div id="telemetryBadge" class="flex items-center space-x-2 px-3 py-1.5 rounded-lg bg-slate-800/80 border border-slate-700/60 text-xs">
          <span id="telemetryDot" class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
          <span class="text-slate-300">Engine:</span>
          <span id="telemetryDevice" class="font-semibold text-brand-400 mono">Detecting...</span>
        </div>
        <button onclick="openBenchmarkModal()" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition flex items-center space-x-1.5">
          <i class="fa-solid fa-gauge-high text-dna-cyan"></i>
          <span>Benchmarks</span>
        </button>
      </div>
    </div>
  </header>

  <!-- GitHub Pages Notice Banner (Only shown in static mode) -->
  <div id="staticModeBanner" class="hidden bg-gradient-to-r from-cyan-950/60 to-slate-900 border-b border-cyan-800/40 px-4 py-2 text-xs text-slate-300 text-center">
    <span class="font-bold text-cyan-400"><i class="fa-solid fa-bolt mr-1"></i>Client-Side Static Mode Active:</span>
    Running in-browser biophysical matching & scoring algorithms. For full multi-core/GPU backend acceleration, run GeneWeaver locally with <code class="mono bg-slate-800 px-1 py-0.5 rounded text-cyan-300">npm run dev</code>.
  </div>
